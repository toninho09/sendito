# cargo-deny configuration: licenses, advisories, bans and sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# rumqttc 0.25.1 pins rustls-webpki 0.102.8, which has no fixed 0.102 release.
# Sendito always passes TlsConfiguration::Rustls with its own rustls 0.23
# ClientConfig, so the 0.102 verifier is never used. Remove these ignores when
# rumqttc allows rustls-webpki 0.103. See docs/DEBT.md.
ignore = [
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
