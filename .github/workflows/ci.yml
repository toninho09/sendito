name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: fmt · clippy · deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration, corpus, UI flows and snapshots
        run: cargo test --workspace --no-fail-fast
      - name: Corpus summary
        if: always()
        run: cat target/corpus/http-summary.txt target/corpus/grpc-summary.txt target/corpus/mcp-summary.txt
      - name: OS keychain (Linux, Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && SENDITO_TEST_OS_KEYCHAIN=1 cargo test -p sendito-store os_keychain -- --nocapture'
      - name: OS keychain (macOS Keychain)
        if: runner.os == 'macOS'
        run: SENDITO_TEST_OS_KEYCHAIN=1 cargo test -p sendito-store os_keychain -- --nocapture
      - name: Upload corpus captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-captures-${{ matrix.os }}
          path: target/corpus

  coverage:
    name: coverage (non-UI crates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage ≥ 80%
        run: |
          cargo llvm-cov -p sendito-core -p sendito-http -p sendito-grpc -p sendito-store -p sendito-import -p sendito-mcp \
            --fail-under-lines 80 --summary-only | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
