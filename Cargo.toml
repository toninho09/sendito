[workspace]
resolver = "3"
members = ["crates/*", "."]
default-members = ["."]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
sendito-core = { path = "crates/core" }
sendito-http = { path = "crates/http" }
sendito-grpc = { path = "crates/grpc" }
sendito-store = { path = "crates/store" }
sendito-import = { path = "crates/import" }
sendito-ui = { path = "crates/ui" }
sendito-testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-stream = "0.1"
bytes = "1"
percent-encoding = "2"
base64 = "0.22"
fastrand = "2"
serde_json_path = "0.7"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http2", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
http = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
keyring = "4"
shell-words = "1"
mime_guess = "2"
insta = "1"
tempfile = "3"

[package]
name = "sendito"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A terminal API client for HTTP and gRPC"
repository = "https://github.com/toninho09/sendito"
readme = "README.md"

[[bin]]
name = "sendito"
path = "src/main.rs"

[dependencies]
sendito-core.workspace = true
sendito-http.workspace = true
sendito-grpc.workspace = true
sendito-store.workspace = true
sendito-import.workspace = true
sendito-ui.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
sendito-testkit.workspace = true
tempfile.workspace = true
base64.workspace = true
fastrand.workspace = true

[lints]
workspace = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
