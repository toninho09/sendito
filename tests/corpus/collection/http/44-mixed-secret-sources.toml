kind = "http"
method = "POST"
url = "{{base_url}}/mixed"

[[headers]]
name = "X-Local"
value = "{{local_token}}"

[[headers]]
name = "X-Keychain"
value = "{{keychain_key}}"

[[headers]]
name = "X-File"
value = "{{file_secret}}"

[[headers]]
name = "X-Plain"
value = "{{user}}"

[body]
type = "form"

[[body.fields]]
name = "token"
value = "{{local_token}}"
