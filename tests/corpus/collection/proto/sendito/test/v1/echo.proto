syntax = "proto3";

package sendito.test.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "sendito/test/v1/common.proto";

// Echoes requests back and records everything it receives.
service Echo {
  rpc Unary(EchoRequest) returns (EchoResponse);
  rpc ServerStream(EchoRequest) returns (stream EchoResponse);
  rpc ClientStream(stream EchoRequest) returns (EchoResponse);
  rpc Bidi(stream EchoRequest) returns (stream EchoResponse);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message EchoRequest {
  string text = 1;
  int32 i32 = 2;
  int64 i64 = 3;
  uint32 u32 = 4;
  uint64 u64 = 5;
  sint32 s32 = 6;
  sint64 s64 = 7;
  fixed32 f32 = 8;
  fixed64 f64 = 9;
  sfixed32 sf32 = 10;
  sfixed64 sf64 = 11;
  float fl = 12;
  double db = 13;
  bool flag = 14;
  bytes data = 15;
  Color color = 16;
  Inner inner = 17;
  repeated string tags = 18;
  repeated Inner items = 19;
  map<string, int64> counts = 20;
  map<int32, Inner> by_id = 21;
  oneof choice {
    string name = 22;
    int32 number = 23;
    Inner nested = 24;
  }
  google.protobuf.Timestamp at = 25;
  google.protobuf.Duration took = 26;
  google.protobuf.Struct meta = 27;
  google.protobuf.Value any_value = 28;
  google.protobuf.StringValue maybe_text = 29;
  google.protobuf.Int64Value maybe_count = 30;
  google.protobuf.Any payload = 31;
  google.protobuf.FieldMask mask = 32;
  optional string opt = 33;
  repeated Color colors = 34;

  // Server controls (not echoed semantics).
  int32 repeat = 40;
  int32 delay_ms = 41;
  int32 fail_code = 42;
  string fail_message = 43;
}

message EchoResponse {
  EchoRequest request = 1;
  map<string, string> metadata = 2;
  int32 index = 3;
  int32 count = 4;
}
